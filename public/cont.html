<!DOCTYPE html>
<html>
<head>
	<title>Contact Me</title>
	<style type="text/css">
	body {
		cursor: url(https://ani.cursors-4u.net/cursors/cur-13/cur1162.ani), url(https://ani.cursors-4u.net/cursors/cur-13/cur1162.png), default !important;
	font-family: Arial, sans-serif;
	background-color: #000;
	color: #fff;
	font-weight: bold;
}

		h1 {
			text-align: center;
			margin-top: 50px;
	        color: #fff;
		}

		.container {
			max-width: 960px;
	        margin: 0 auto;
	        padding: 20px;
			background-color: #1d1b1b;
			border-radius: 10px;
			box-shadow: 0 0 10px rgba(0,0,0,0.2);
		}

		label {
			display: block;
			margin-bottom: 10px;
			color: #fff;
		}

		input[type="text"], input[type="email"], textarea {
			display: block;
			width: 98%;
			padding: 10px;
			border: 1px solid #ccc;
			border-radius: 5px;
			margin-bottom: 20px;
		}

		button {
			background-color: #333;
			color: #fff;
			border: none;
			padding: 10px 20px;
			border-radius: 5px;
			cursor: pointer;
		}

		button:hover {
			background-color: #666;
		}

		ul {
			margin-top: 20px;
			padding: 0;
			display: flex;
			justify-content: center;
            list-style: none;
	
		}

		li {
			margin-right: 20px;
		}

		a {
			color: #fff;
			text-decoration: none;
		}

		a:hover {
			color: #666;
		}
	</style>
</head>
<body>
	<h1>🅲🅾🅽🆃🅰🅲🆃 🅼🅴</h1>
	<div class="container">
		<form action="/submit" method="post">
			<label for="name">Name:</label>
			<input type="text" id="name" name="name" required>

			<label for="email">Email:</label>
			<input type="email" id="email" name="email" required>

			<label for="message">Message:</label>
			<textarea id="message" name="message" required></textarea>

			<button type="submit">⡷⠂SΞИD⠐⢾</button>
		</form>

		<ul>
			<li><a href="https://www.instagram.com/" target="_blank">Instagram</a></li>
			<li><a href="https://www.facebook.com/" target="_blank">Facebook</a></li>
		</ul>

		<p>You can Also reach me at:</p>
		<p>Some Place</p>
		<p>Some Place</p>
		<p>Email: <a href="mailto:fawad.ariif@gmail.com">fawad.ariif@gmail.com</a></p>
	</div>
</body>
</html>
